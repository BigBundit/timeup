<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จับเวลา</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 48px 40px;
      background: #111111;
      border-radius: 24px;
      border: 1px solid #222222;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), 0 0 120px rgba(0, 200, 255, 0.04);
      min-width: 360px;
    }

    .title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 36px;
    }

    .display {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: 0.04em;
      color: #f0f0f0;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 12px;
    }

    .display.running {
      color: #00e5ff;
      text-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
    }

    .milliseconds {
      font-size: 28px;
      font-weight: 300;
      color: #444444;
      letter-spacing: 0.1em;
      margin-bottom: 48px;
      font-variant-numeric: tabular-nums;
    }

    .milliseconds.running {
      color: #005f70;
    }

    .controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
      min-width: 96px;
      outline: none;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-start {
      background: #00c853;
      color: #000000;
    }

    .btn-start:hover {
      background: #00e676;
      box-shadow: 0 0 20px rgba(0, 200, 83, 0.4);
    }

    .btn-stop {
      background: #1a1a1a;
      color: #ff5252;
      border: 1px solid #2a2a2a;
    }

    .btn-stop:hover {
      background: #ff5252;
      color: #000000;
      border-color: #ff5252;
      box-shadow: 0 0 20px rgba(255, 82, 82, 0.4);
    }

    .btn-stop:disabled {
      color: #333333;
      border-color: #1e1e1e;
      cursor: not-allowed;
      background: #111111;
    }

    .btn-stop:disabled:hover {
      box-shadow: none;
    }

    .btn-reset {
      background: #1a1a1a;
      color: #888888;
      border: 1px solid #2a2a2a;
    }

    .btn-reset:hover {
      background: #222222;
      color: #cccccc;
      border-color: #444444;
    }

    .lap-section {
      margin-top: 32px;
      max-height: 200px;
      overflow-y: auto;
    }

    .lap-section::-webkit-scrollbar {
      width: 4px;
    }

    .lap-section::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    .lap-section::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 2px;
    }

    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 13px;
      color: #555555;
      font-variant-numeric: tabular-nums;
    }

    .lap-item:first-child {
      border-top: 1px solid #1a1a1a;
    }

    .lap-num {
      color: #333333;
    }

    .lap-time {
      color: #555555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">จับเวลา</div>

    <div class="display" id="display">00:00:00</div>
    <div class="milliseconds" id="ms">.000</div>

    <div class="controls">
      <button class="btn-start" id="btnStart" onclick="handleStart()">เริ่ม</button>
      <button class="btn-stop" id="btnStop" onclick="handleStop()" disabled>หยุด</button>
      <button class="btn-reset" id="btnReset" onclick="handleReset()">รีเซต</button>
    </div>
  </div>

  <script>
    let startTime = 0;
    let elapsed = 0;
    let timerInterval = null;
    let running = false;

    const display = document.getElementById('display');
    const msDisplay = document.getElementById('ms');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');

    function pad(n, len = 2) {
      return String(n).padStart(len, '0');
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      const millis = ms % 1000;
      return {
        main: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`,
        ms: `.${pad(millis, 3)}`
      };
    }

    function updateDisplay() {
      const now = elapsed + (running ? Date.now() - startTime : 0);
      const { main, ms } = formatTime(now);
      display.textContent = main;
      msDisplay.textContent = ms;
    }

    function handleStart() {
      if (running) return;
      startTime = Date.now();
      running = true;
      timerInterval = setInterval(updateDisplay, 30);

      display.classList.add('running');
      msDisplay.classList.add('running');
      btnStart.disabled = true;
      btnStop.disabled = false;
    }

    function handleStop() {
      if (!running) return;
      elapsed += Date.now() - startTime;
      running = false;
      clearInterval(timerInterval);
      updateDisplay();

      display.classList.remove('running');
      msDisplay.classList.remove('running');
      btnStart.disabled = false;
      btnStop.disabled = true;
    }

    function handleReset() {
      running = false;
      clearInterval(timerInterval);
      elapsed = 0;
      startTime = 0;

      display.textContent = '00:00:00';
      msDisplay.textContent = '.000';
      display.classList.remove('running');
      msDisplay.classList.remove('running');
      btnStart.disabled = false;
      btnStop.disabled = true;
    }
  </script>
</body>
</html>
