<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จับเวลา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@100;200;300;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 100%; height: 100%; }

    body {
      background: #0a0a0a;
      font-family: 'Prompt', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
    }

    .title {
      font-size: clamp(12px, 1.8vw, 22px);
      font-weight: 300;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #333;
      margin-bottom: 2vh;
    }

    .display {
      font-size: clamp(80px, 22vw, 340px);
      font-weight: 100;
      letter-spacing: -0.01em;
      color: #eeeeee;
      font-variant-numeric: tabular-nums;
      line-height: 0.9;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      white-space: nowrap;
    }

    .display.running {
      color: #00e5ff;
      text-shadow: 0 0 80px rgba(0, 229, 255, 0.25);
    }

    .display.alarm-flash {
      animation: alarmFlash 0.5s ease-in-out infinite alternate;
    }

    @keyframes alarmFlash {
      from { color: #ff5252; text-shadow: 0 0 80px rgba(255, 82, 82, 0.5); }
      to   { color: #ff8a80; text-shadow: 0 0 120px rgba(255, 82, 82, 0.8); }
    }

    .milliseconds {
      font-size: clamp(36px, 8vw, 120px);
      font-weight: 100;
      color: #272727;
      letter-spacing: 0.05em;
      margin-top: 1vh;
      margin-bottom: 5vh;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }

    .milliseconds.running { color: #004f5e; }

    .controls {
      display: flex;
      gap: clamp(12px, 2.5vw, 40px);
      align-items: center;
    }

    button {
      font-family: 'Prompt', sans-serif;
      font-size: clamp(16px, 2.5vw, 32px);
      font-weight: 600;
      padding: clamp(14px, 2.2vh, 28px) clamp(32px, 6vw, 80px);
      border: none;
      border-radius: 100px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: all 0.15s ease;
      outline: none;
    }

    button:active { transform: scale(0.95); }

    .btn-start {
      background: #00c853;
      color: #000;
    }
    .btn-start:hover:not(:disabled) {
      background: #00e676;
      box-shadow: 0 0 40px rgba(0, 200, 83, 0.5);
    }
    .btn-start:disabled {
      background: #0b2116;
      color: #143322;
      cursor: not-allowed;
    }

    .btn-stop {
      background: transparent;
      color: #ff5252;
      border: 2px solid #2a2a2a;
    }
    .btn-stop:hover:not(:disabled) {
      background: #ff5252;
      color: #000;
      border-color: #ff5252;
      box-shadow: 0 0 40px rgba(255, 82, 82, 0.5);
    }
    .btn-stop:disabled {
      color: #222;
      border-color: #181818;
      cursor: not-allowed;
    }

    .btn-reset {
      background: transparent;
      color: #444;
      border: 2px solid #1e1e1e;
    }
    .btn-reset:hover {
      color: #aaa;
      border-color: #444;
    }

    /* Sound button — circular icon button */
    .btn-sound {
      padding: 0;
      width:  clamp(48px, 7vw, 80px);
      height: clamp(48px, 7vw, 80px);
      font-size: clamp(20px, 3vw, 36px);
      background: transparent;
      color: #555;
      border: 2px solid #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0;
    }
    .btn-sound:hover { color: #aaa; border-color: #444; }
    .btn-sound.muted { color: #2a2a2a; border-color: #161616; }
    .btn-sound.ringing {
      color: #ffd740;
      border-color: #ffd740;
      box-shadow: 0 0 24px rgba(255, 215, 64, 0.5);
      animation: bellShake 0.4s ease-in-out infinite;
    }

    @keyframes bellShake {
      0%,100% { transform: rotate(0deg) scale(0.95); }
      25%      { transform: rotate(-12deg) scale(1); }
      75%      { transform: rotate(12deg) scale(1); }
    }

    @media (max-height: 500px) {
      .display     { font-size: clamp(60px, 18vh, 160px); }
      .milliseconds{ font-size: clamp(24px, 7vh, 64px); margin-bottom: 3vh; }
    }
  </style>
</head>
<body>
  <div class="title">จับเวลา</div>

  <div class="display" id="display">00:00:00</div>
  <div class="milliseconds" id="ms">.000</div>

  <div class="controls">
    <button class="btn-start" id="btnStart" onclick="handleStart()">เริ่ม</button>
    <button class="btn-stop"  id="btnStop"  onclick="handleStop()" disabled>หยุด</button>
    <button class="btn-reset"               onclick="handleReset()">รีเซต</button>
    <button class="btn-sound" id="btnSound" onclick="handleSound()">🔔</button>
  </div>

  <script>
    const ALARM_AT_MS = 5 * 60 * 1000; // 5 minutes

    let startTime = 0, elapsed = 0;
    let timerInterval = null, running = false;
    let soundEnabled = true, alarmFired = false;
    let alarmOscs = [];
    let audioCtx = null;

    const display   = document.getElementById('display');
    const msDisplay = document.getElementById('ms');
    const btnStart  = document.getElementById('btnStart');
    const btnStop   = document.getElementById('btnStop');
    const btnSound  = document.getElementById('btnSound');

    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    /* ── Short tick for button presses ── */
    function playTick() {
      if (!soundEnabled) return;
      const ctx = getCtx();
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = 900;
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
      osc.start(); osc.stop(ctx.currentTime + 0.07);
    }

    /* ── Alarm clock sound (classic double-ring pattern) ── */
    function playAlarm() {
      stopAlarm();
      if (!soundEnabled) return;
      const ctx = getCtx();
      alarmOscs = [];
      let t = ctx.currentTime;

      /* 10 groups × 3 double-beeps = ~8 sec of ringing */
      for (let g = 0; g < 10; g++) {
        for (let b = 0; b < 3; b++) {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'square';
          /* alternate 880 Hz → 1046 Hz inside each beep (classic alarm tone) */
          osc.frequency.setValueAtTime(880,  t);
          osc.frequency.setValueAtTime(1046, t + 0.09);
          gain.gain.setValueAtTime(0,    t);
          gain.gain.linearRampToValueAtTime(0.22, t + 0.008);
          gain.gain.setValueAtTime(0.22, t + 0.16);
          gain.gain.linearRampToValueAtTime(0,    t + 0.19);
          osc.start(t); osc.stop(t + 0.19);
          alarmOscs.push(osc);
          t += 0.21;
        }
        t += 0.38; // pause between groups
      }
    }

    function stopAlarm() {
      alarmOscs.forEach(o => { try { o.stop(0); } catch(_){} });
      alarmOscs = [];
    }

    /* ── Sound toggle button ── */
    function handleSound() {
      soundEnabled = !soundEnabled;
      btnSound.textContent = soundEnabled ? '🔔' : '🔕';
      btnSound.classList.toggle('muted', !soundEnabled);
      /* play a preview beep when turning ON */
      if (soundEnabled) playTick();
    }

    function pad(n, len = 2) { return String(n).padStart(len, '0'); }

    function updateDisplay() {
      const now = elapsed + (running ? Date.now() - startTime : 0);
      const s = Math.floor(now / 1000);
      display.textContent   = `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;
      msDisplay.textContent = `.${pad(now % 1000, 3)}`;

      /* Trigger alarm once at 5 minutes */
      if (now >= ALARM_AT_MS && !alarmFired) {
        alarmFired = true;
        display.classList.remove('running');
        display.classList.add('alarm-flash');
        btnSound.classList.add('ringing');
        playAlarm();
      }
    }

    function clearAlarmState() {
      display.classList.remove('alarm-flash');
      btnSound.classList.remove('ringing');
      stopAlarm();
      alarmFired = false;
    }

    function handleStart() {
      if (running) return;
      playTick();
      startTime = Date.now(); running = true;
      timerInterval = setInterval(updateDisplay, 30);
      display.classList.remove('alarm-flash');
      display.classList.add('running');
      msDisplay.classList.add('running');
      btnStart.disabled = true;
      btnStop.disabled  = false;
    }

    function handleStop() {
      if (!running) return;
      playTick();
      elapsed += Date.now() - startTime; running = false;
      clearInterval(timerInterval); updateDisplay();
      if (!alarmFired) {
        display.classList.remove('running');
        msDisplay.classList.remove('running');
      }
      btnStart.disabled = false;
      btnStop.disabled  = true;
    }

    function handleReset() {
      playTick();
      running = false; clearInterval(timerInterval);
      elapsed = 0; startTime = 0;
      display.textContent   = '00:00:00';
      msDisplay.textContent = '.000';
      display.classList.remove('running');
      msDisplay.classList.remove('running');
      clearAlarmState();
      btnStart.disabled = false;
      btnStop.disabled  = true;
    }
  </script>
</body>
</html>
