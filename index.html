<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จับเวลา</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: min(92vw, 700px);
      padding: clamp(32px, 6vh, 80px) clamp(24px, 5vw, 80px);
      background: #111111;
      border-radius: clamp(16px, 3vw, 32px);
      border: 1px solid #222222;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), 0 0 120px rgba(0, 200, 255, 0.04);
    }

    .title {
      font-size: clamp(11px, 1.5vw, 15px);
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: clamp(24px, 4vh, 48px);
    }

    .display {
      font-size: clamp(48px, 14vw, 120px);
      font-weight: 200;
      letter-spacing: 0.04em;
      color: #f0f0f0;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: clamp(6px, 1.5vh, 16px);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .display.running {
      color: #00e5ff;
      text-shadow: 0 0 40px rgba(0, 229, 255, 0.35);
    }

    .milliseconds {
      font-size: clamp(20px, 5vw, 44px);
      font-weight: 300;
      color: #3a3a3a;
      letter-spacing: 0.1em;
      margin-bottom: clamp(36px, 7vh, 72px);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }

    .milliseconds.running {
      color: #00677a;
    }

    .controls {
      display: flex;
      gap: clamp(10px, 2.5vw, 24px);
      justify-content: center;
      flex-wrap: nowrap;
    }

    button {
      padding: clamp(12px, 2.2vh, 20px) clamp(20px, 4vw, 48px);
      border: none;
      border-radius: clamp(10px, 1.5vw, 16px);
      font-size: clamp(13px, 2.2vw, 18px);
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: all 0.15s ease;
      flex: 1;
      max-width: clamp(90px, 20vw, 160px);
      outline: none;
      white-space: nowrap;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-start {
      background: #00c853;
      color: #000000;
    }

    .btn-start:hover:not(:disabled) {
      background: #00e676;
      box-shadow: 0 0 24px rgba(0, 200, 83, 0.45);
    }

    .btn-start:disabled {
      background: #0d2e17;
      color: #1a4d27;
      cursor: not-allowed;
    }

    .btn-stop {
      background: #1a1a1a;
      color: #ff5252;
      border: 1px solid #2a2a2a;
    }

    .btn-stop:hover:not(:disabled) {
      background: #ff5252;
      color: #000000;
      border-color: #ff5252;
      box-shadow: 0 0 24px rgba(255, 82, 82, 0.45);
    }

    .btn-stop:disabled {
      color: #2e2e2e;
      border-color: #1a1a1a;
      cursor: not-allowed;
      background: #111111;
    }

    .btn-reset {
      background: #1a1a1a;
      color: #888888;
      border: 1px solid #2a2a2a;
    }

    .btn-reset:hover {
      background: #222222;
      color: #cccccc;
      border-color: #444444;
    }

    /* Phone portrait — stack is fine, but bump display larger relative to screen */
    @media (max-width: 400px) {
      .display {
        font-size: clamp(52px, 18vw, 80px);
      }
      .milliseconds {
        font-size: clamp(22px, 7vw, 36px);
      }
      button {
        padding: 14px 12px;
        font-size: 14px;
      }
    }

    /* Landscape phone — shrink vertical spacing */
    @media (max-height: 500px) {
      .container {
        padding: 20px clamp(24px, 5vw, 80px);
      }
      .title {
        margin-bottom: 12px;
      }
      .milliseconds {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">จับเวลา</div>

    <div class="display" id="display">00:00:00</div>
    <div class="milliseconds" id="ms">.000</div>

    <div class="controls">
      <button class="btn-start" id="btnStart" onclick="handleStart()">เริ่ม</button>
      <button class="btn-stop"  id="btnStop"  onclick="handleStop()"  disabled>หยุด</button>
      <button class="btn-reset" id="btnReset" onclick="handleReset()">รีเซต</button>
    </div>
  </div>

  <script>
    let startTime = 0;
    let elapsed = 0;
    let timerInterval = null;
    let running = false;

    const display  = document.getElementById('display');
    const msDisplay = document.getElementById('ms');
    const btnStart = document.getElementById('btnStart');
    const btnStop  = document.getElementById('btnStop');

    function pad(n, len = 2) {
      return String(n).padStart(len, '0');
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const hours   = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      const millis  = ms % 1000;
      return {
        main: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`,
        ms:   `.${pad(millis, 3)}`
      };
    }

    function updateDisplay() {
      const now = elapsed + (running ? Date.now() - startTime : 0);
      const { main, ms } = formatTime(now);
      display.textContent = main;
      msDisplay.textContent = ms;
    }

    function handleStart() {
      if (running) return;
      startTime = Date.now();
      running = true;
      timerInterval = setInterval(updateDisplay, 30);
      display.classList.add('running');
      msDisplay.classList.add('running');
      btnStart.disabled = true;
      btnStop.disabled  = false;
    }

    function handleStop() {
      if (!running) return;
      elapsed += Date.now() - startTime;
      running = false;
      clearInterval(timerInterval);
      updateDisplay();
      display.classList.remove('running');
      msDisplay.classList.remove('running');
      btnStart.disabled = false;
      btnStop.disabled  = true;
    }

    function handleReset() {
      running = false;
      clearInterval(timerInterval);
      elapsed = 0;
      startTime = 0;
      display.textContent  = '00:00:00';
      msDisplay.textContent = '.000';
      display.classList.remove('running');
      msDisplay.classList.remove('running');
      btnStart.disabled = false;
      btnStop.disabled  = true;
    }
  </script>
</body>
</html>
